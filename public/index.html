<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calendar App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar-container">

        <h1>Calendar App</h1>

        <div class="calendar-header">

            <button id="previous-month">
                &lt;
            </button>

            <h2 id="month-year"></h2>

            <button id="next-month">
                &gt;
            </button>

        </div>

        <button id="today-button">
            Today
        </button>

        <div class="calendar">

            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div id="calendar-days" class="calendar-days">
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
